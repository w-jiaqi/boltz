# Evolution head training configuration
#
# Usage:
#   python scripts/train/train_evolution.py scripts/train/configs/evolution.yaml
#
# Override any value:
#   python scripts/train/train_evolution.py scripts/train/configs/evolution.yaml \
#       training.lr=5e-4 debug=true data_dir=/my/data

# ----- Data -----
# Must contain: cache/*.pt, train_pairs.csv, (optional) val_pairs.csv
# Produced by prepare_evolution_data.py + cache_evolution_features.py
data_dir: SET_PATH_HERE

# ----- Output -----
output: SET_PATH_HERE
pretrained: null                          # Path to a pretrained evolution checkpoint
resume: null                              # Path to a Lightning checkpoint to resume

# ----- Evolution module architecture -----
# Must match Boltz2 trunk dimensions (token_s=384, token_z=128)
evolution_model_args:
  token_s: 384
  token_z: 128
  pairformer_args:
    num_blocks: 4
    dropout: 0.25
    pairwise_head_width: 32
    pairwise_num_heads: 4
    activation_checkpointing: false
  head_hidden_dim: 384
  num_dist_bins: 64
  max_dist: 22
  use_interface_mask: false               # false=all pairs, true=interface only

# ----- Training -----
training:
  lr: 1.8e-3
  adam_beta_1: 0.9
  adam_beta_2: 0.95
  adam_eps: 1.0e-8
  weight_decay: 0.0
  bt_weight: 1.0                          # Bradley-Terry loss weight
  margin_weight: 0.5                      # Margin ranking loss weight (0 to disable)
  bt_temperature: 1.0
  margin_alpha: 1.0
  lr_scheduler: linear_warmup_cosine
  lr_warmup_steps: 1000
  lr_cosine_T_max: 50000
  lr_min: 1.0e-6

# ----- Trainer (PyTorch Lightning) -----
trainer:
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 10.0
  max_epochs: 100
  accumulate_grad_batches: 16
  check_val_every_n_epoch: 1

# ----- Misc -----
num_workers: 4
save_top_k: 3
max_cached_in_memory: 2000                # LRU cache size for .pt files
debug: false

# ----- Wandb (uncomment to enable) -----
# wandb:
#   name: evolution-head
#   project: boltz-evolution
#   entity: your-entity
